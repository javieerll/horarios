<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<meta name="description" content="Horario del instituto: materias de la mañana, extraescolares de la tarde y anotaciones del día.">
<title>Mi Horario del Instituto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body, button, input, textarea {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    margin: 0;
    min-height: 100dvh;
    color: #0f2744;
    background: #f3f6fb;
  }
  button, input, textarea { font-size: 16px; }
  button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  .is-hidden { display: none !important; }
  .day-on { background: #1d4ed8; color: white; }
</style>
</head>
<body>
  <main class="mx-auto w-full max-w-md px-4 pt-[max(0.75rem,env(safe-area-inset-top))] pb-[max(1.25rem,env(safe-area-inset-bottom))]">
    <a href="/" class="mb-2 inline-block text-sm underline opacity-70">← Horarios</a>
    <header class="border-b border-blue-100 pb-4">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-blue-700">Semana lectiva</p>
      <h1 class="mt-1 text-3xl font-semibold tracking-tight">Mi Horario del Instituto</h1>
      <p class="mt-2 text-sm leading-relaxed text-slate-600">Lunes y martes incluyen un ejemplo de jornada de ESO. Los cambios se guardan solos en este navegador.</p>
    </header>

    <div id="days" class="mt-4 grid grid-cols-5 gap-1.5" role="group" aria-label="Días de la semana"></div>

    <section class="mt-4 rounded-2xl border border-blue-100 bg-white p-3" aria-labelledby="titulo-manana">
      <h2 id="titulo-manana" class="text-base font-semibold text-blue-800">Instituto (Mañana)</h2>
      <div id="materias" class="mt-3 space-y-2"></div>
      <button id="add-materia" type="button" class="mt-3 w-full rounded-xl bg-blue-600 px-3 py-2.5 text-sm font-semibold text-white active:scale-[0.99]">+ Añadir materia</button>
    </section>

    <section class="mt-3 rounded-2xl border border-blue-100 bg-white p-3" aria-labelledby="titulo-tarde">
      <h2 id="titulo-tarde" class="text-base font-semibold text-blue-800">Extraescolares (Tarde)</h2>
      <div id="actividades" class="mt-3 space-y-2"></div>
      <button id="add-actividad" type="button" class="mt-3 w-full rounded-xl border border-blue-200 bg-blue-50 px-3 py-2.5 text-sm font-semibold text-blue-800 active:scale-[0.99]">+ Añadir actividad</button>
    </section>

    <section class="mt-3 rounded-2xl border border-blue-100 bg-white p-3" aria-labelledby="titulo-notas">
      <h2 id="titulo-notas" class="text-base font-semibold text-blue-800">Anotaciones del día</h2>
      <label for="notas" class="mt-1 block text-xs text-slate-500">Deberes, exámenes o material</label>
      <textarea id="notas" rows="5" class="mt-2 min-h-32 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-base leading-relaxed outline-none focus:border-blue-400" placeholder="Ejemplo: examen de matemáticas el jueves"></textarea>
      <p id="saved" class="mt-1 min-h-5 text-xs text-blue-700" role="status"></p>
    </section>
  </main>

  <div id="confirm" class="is-hidden fixed inset-0 z-50 grid place-items-end sm:place-items-center" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <button id="confirm-backdrop" type="button" class="absolute inset-0 bg-slate-900/40" aria-label="Cerrar"></button>
    <div class="relative m-0 w-full max-w-md rounded-t-2xl border border-blue-100 bg-white p-4 pb-[max(1rem,env(safe-area-inset-bottom))] sm:rounded-2xl">
      <h2 id="confirm-title" class="text-lg font-semibold">Eliminar</h2>
      <p id="confirm-text" class="mt-1 text-sm leading-relaxed text-slate-600"></p>
      <div class="mt-4 grid grid-cols-2 gap-2">
        <button id="confirm-no" type="button" class="rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-semibold">Cancelar</button>
        <button id="confirm-yes" type="button" class="rounded-xl bg-blue-700 px-3 py-2.5 text-sm font-semibold text-white">Eliminar</button>
      </div>
    </div>
  </div>

<script>
const STORAGE_KEY = "horarioInstituto";
const DAYS = [
  { id: "lunes", label: "Lunes" },
  { id: "martes", label: "Martes" },
  { id: "miercoles", label: "Miércoles" },
  { id: "jueves", label: "Jueves" },
  { id: "viernes", label: "Viernes" }
];

function emptyDay() {
  return { materias: [], actividades: [], notas: "" };
}

function item(hora, nombre) {
  return { id: hora + "-" + nombre, hora: hora, nombre: nombre };
}

function seed() {
  return {
    lunes: {
      materias: [
        item("8:15-9:10", "Matemáticas"),
        item("9:10-10:05", "Lengua castellana y literatura"),
        item("10:05-11:00", "Inglés"),
        item("11:25-12:20", "Física y Química"),
        item("12:20-13:15", "Geografía e Historia"),
        item("13:15-14:10", "Educación física")
      ],
      actividades: [
        item("16:30-18:00", "Baloncesto")
      ],
      notas: "Examen de matemáticas el jueves. Repasar ecuaciones."
    },
    martes: {
      materias: [
        item("8:15-9:10", "Biología y Geología"),
        item("9:10-10:05", "Matemáticas"),
        item("10:05-11:00", "Tecnología y Digitalización"),
        item("11:25-12:20", "Lengua castellana y literatura"),
        item("12:20-13:15", "Francés"),
        item("13:15-14:10", "Tutoría")
      ],
      actividades: [
        item("17:00-18:30", "Academia de inglés")
      ],
      notas: "Entregar el trabajo de tecnología."
    },
    miercoles: emptyDay(),
    jueves: emptyDay(),
    viernes: emptyDay()
  };
}

const $ = (id) => document.getElementById(id);
let state = load();
let current = initialDay();
let pending = null;
let savedTimer = 0;

function todayId() {
  const map = { 1: "lunes", 2: "martes", 3: "miercoles", 4: "jueves", 5: "viernes" };
  return map[new Date().getDay()] || "lunes";
}

function initialDay() {
  const today = todayId();
  const day = state[today];
  const hasContent = day.materias.length || day.actividades.length || day.notas.trim();
  return hasContent ? today : "lunes";
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return seed();
    const data = JSON.parse(raw);
    const next = {};
    DAYS.forEach((day) => {
      const source = data[day.id] || {};
      next[day.id] = {
        materias: Array.isArray(source.materias) ? source.materias : [],
        actividades: Array.isArray(source.actividades) ? source.actividades : [],
        notas: typeof source.notas === "string" ? source.notas : ""
      };
    });
    return next;
  } catch (err) {
    return seed();
  }
}

function store() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; } catch (err) { return false; }
}

function persist() {
  const ok = store();
  const note = $("saved");
  if (!note) return;
  note.textContent = ok ? "Guardado" : "No se puede guardar en este navegador (¿modo privado?)";
  window.clearTimeout(savedTimer);
  savedTimer = window.setTimeout(() => { note.textContent = ""; }, 1200);
}

function captureNotes() {
  const box = $("notas");
  if (box) state[current].notas = box.value;
}

function renderDays() {
  const bar = $("days");
  bar.replaceChildren();
  DAYS.forEach((day) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = day.label.slice(0, 3);
    button.setAttribute("aria-label", day.label);
    button.setAttribute("aria-pressed", day.id === current ? "true" : "false");
    button.className = "min-h-11 rounded-xl text-sm font-semibold " + (day.id === current ? "day-on" : "bg-white text-blue-900 border border-blue-100");
    button.addEventListener("click", () => setDay(day.id));
    bar.appendChild(button);
  });
}

function renderList(container, items, kind) {
  container.replaceChildren();
  if (!items.length) {
    const empty = document.createElement("p");
    empty.className = "rounded-lg bg-slate-50 px-3 py-2 text-sm text-slate-500";
    empty.textContent = kind === "materias" ? "Sin materias este día." : "Sin actividades este día.";
    container.appendChild(empty);
    return;
  }
  items.forEach((entry) => {
    const row = document.createElement("div");
    row.dataset.id = entry.id;
    row.dataset.kind = kind;
    row.className = "grid grid-cols-[minmax(0,1fr)_auto] items-center gap-1.5";
    const hora = document.createElement("input");
    hora.dataset.field = "hora";
    hora.value = entry.hora;
    hora.maxLength = 22;
    hora.placeholder = "8:15-9:10";
    hora.setAttribute("aria-label", "Horario");
    hora.autocomplete = "off";
    hora.className = "w-full rounded-lg border border-slate-200 bg-slate-50 px-2 py-2 text-base outline-none focus:border-blue-400";
    const nombre = document.createElement("input");
    nombre.dataset.field = "nombre";
    nombre.value = entry.nombre;
    nombre.maxLength = 70;
    nombre.placeholder = kind === "materias" ? "Materia" : "Actividad";
    nombre.setAttribute("aria-label", kind === "materias" ? "Materia" : "Actividad");
    nombre.autocomplete = "off";
    nombre.className = "min-w-0 w-full rounded-lg border border-slate-200 bg-slate-50 px-2 py-2 text-base outline-none focus:border-blue-400";
    const remove = document.createElement("button");
    remove.type = "button";
    remove.dataset.action = "delete";
    remove.textContent = "Quitar";
    remove.setAttribute("aria-label", "Quitar " + (entry.nombre || "este elemento"));
    remove.className = "row-span-2 self-center rounded-lg px-2 py-2 text-xs font-semibold text-slate-500";
    row.append(hora, remove, nombre);
    container.appendChild(row);
  });
}

function render() {
  renderDays();
  const day = state[current];
  renderList($("materias"), day.materias, "materias");
  renderList($("actividades"), day.actividades, "actividades");
  $("notas").value = day.notas;
}

function setDay(next) {
  if (next === current) return;
  captureNotes();
  persist();
  current = next;
  render();
}

function add(kind) {
  captureNotes();
  const entry = { id: uid(), hora: "", nombre: "" };
  state[current][kind].push(entry);
  persist();
  render();
  const field = document.querySelector('[data-kind="' + kind + '"][data-id="' + entry.id + '"] [data-field="nombre"]');
  if (field) field.focus();
}

function askDelete(kind, id) {
  const entry = state[current][kind].find((item) => item.id === id);
  if (!entry) return;
  pending = { kind: kind, id: id };
  const what = kind === "materias" ? "esta materia" : "esta actividad";
  $("confirm-text").textContent = entry.nombre
    ? "¿Eliminar " + entry.nombre + "?"
    : "¿Eliminar " + what + "?";
  $("confirm").classList.remove("is-hidden");
  $("confirm-no").focus();
}

function closeConfirm() {
  pending = null;
  $("confirm").classList.add("is-hidden");
}

function confirmDelete() {
  if (!pending) return;
  const kind = pending.kind;
  state[current][kind] = state[current][kind].filter((item) => item.id !== pending.id);
  closeConfirm();
  persist();
  render();
}

function onInput(event) {
  const row = event.target.closest("[data-id]");
  if (!row) return;
  const list = state[current][row.dataset.kind];
  const entry = list.find((item) => item.id === row.dataset.id);
  if (!entry) return;
  entry[event.target.dataset.field] = event.target.value;
  persist();
}

function onClick(event) {
  const button = event.target.closest("[data-action='delete']");
  if (!button) return;
  const row = button.closest("[data-id]");
  askDelete(row.dataset.kind, row.dataset.id);
}

$("materias").addEventListener("input", onInput);
$("actividades").addEventListener("input", onInput);
$("materias").addEventListener("click", onClick);
$("actividades").addEventListener("click", onClick);
$("add-materia").addEventListener("click", () => add("materias"));
$("add-actividad").addEventListener("click", () => add("actividades"));
$("notas").addEventListener("input", () => {
  state[current].notas = $("notas").value;
  persist();
});
$("confirm-yes").addEventListener("click", confirmDelete);
$("confirm-no").addEventListener("click", closeConfirm);
$("confirm-backdrop").addEventListener("click", closeConfirm);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !$("confirm").classList.contains("is-hidden")) closeConfirm();
});
window.addEventListener("pagehide", () => {
  captureNotes();
  store();
});

render();
</script>
</body>
</html>
